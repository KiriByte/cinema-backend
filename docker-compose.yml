services:
  # Database PostgresSQL
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: cinema_db
      POSTGRES_USER: cinema_user
      POSTGRES_PASSWORD: cinema_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cinema-network

#  # MinIO Storage
#  minio:
#    image: minio/minio:latest
#    container_name: minio
#    command: server /data --console-address ":9001"
#    environment:
#      MINIO_ROOT_USER: minioadmin
#      MINIO_ROOT_PASSWORD: minioadmin
#    ports:
#      - "9000:9000"  # API
#      - "9001:9001"  # Console
#    volumes:
#      - minio_data:/data
#    networks:
#      - cinema-network
#    healthcheck:
#      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
#      interval: 30s
#      timeout: 20s
#      retries: 3

  # Eureka Server
  eureka-server:
    build:
      context: .
      dockerfile: eureka-server.Dockerfile
    container_name: cinema-eureka-server
    ports:
      - "8761:8761"
    networks:
      - cinema-network
    depends_on:
      - postgres

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway.Dockerfile
    container_name: cinema-api-gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka
    networks:
      - cinema-network
    depends_on:
      - eureka-server
      - auth-service
      - hall-service
      - movie-service
      - user-service

  # Auth Service
  auth-service:
    build:
      context: .
      dockerfile: auth-service.Dockerfile
    container_name: cinema-auth-service
    environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/cinema_db
      - SPRING_DATASOURCE_USERNAME=cinema_user
      - SPRING_DATASOURCE_PASSWORD=cinema_password
      - JWT_SECRET=mysupersecretkeyforjwtmysupersecretkeyforjwtmysupersecretkeyforjwt
      - JWT_ACCESS_TOKEN_EXPIRATION_MINUTES=30
      - JWT_REFRESH_TOKEN_EXPIRATION_DAYS=7
    networks:
      - cinema-network
    depends_on:
      - eureka-server
      - postgres

  # User Service
  user-service:
    build:
      context: .
      dockerfile: user-service.Dockerfile
    container_name: cinema-user-service
    environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/cinema_db
      - SPRING_DATASOURCE_USERNAME=cinema_user
      - SPRING_DATASOURCE_PASSWORD=cinema_password
    networks:
      - cinema-network
    depends_on:
      - eureka-server
      - postgres

  # Hall Service
  hall-service:
    build:
      context: .
      dockerfile: hall-service.Dockerfile
    container_name: cinema-hall-service
    environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/cinema_db
      - SPRING_DATASOURCE_USERNAME=cinema_user
      - SPRING_DATASOURCE_PASSWORD=cinema_password
    networks:
      - cinema-network
    depends_on:
      - eureka-server
      - postgres

  # Movie Service
  movie-service:
    build:
      context: .
      dockerfile: movie-service.Dockerfile
    container_name: cinema-movie-service
    environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/cinema_db
      - SPRING_DATASOURCE_USERNAME=cinema_user
      - SPRING_DATASOURCE_PASSWORD=cinema_password
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_LOGIN=minioadmin
      - MINIO_PASSWORD=minioadmin
    networks:
      - cinema-network
    depends_on:
      - eureka-server
      - postgres

volumes:
  postgres_data:
  minio_data:


networks:
  cinema-network:
    driver: bridge
