name: CI on Pull Request to Develop
on:
  pull_request:
    branches:
      - develop

permissions:
  pull-requests: read
  contents: read

jobs:
  detect-changed-modules:
    name: Detect Changed Modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed modules
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth-service:
              - 'auth-service/**'
            hall-service:
              - 'hall-service/**'
            movie-service:
              - 'movie-service/**'
            user-service:
              - 'user-service/**'
            common:
              - 'common/**'
            root-config:
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle.properties'
              - 'gradlew'

  test-changed-modules:
    name: Test Changed Modules
    needs: detect-changed-modules
    if: needs.detect-changed-modules.outputs.modules != '[]'
    #if: always()
    runs-on: ubuntu-latest

    strategy:
      matrix:
        module: ${{ fromJSON(needs.detect-changed-modules.outputs.modules) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: wrapper

      - name: Make gradlew executable
        run: |
          gradle wrapper
          chmod +x ./gradlew

      - name: Debug information
        run: |
          echo "Current directory: $(pwd)"
          echo "Files:"
          ls -la
          echo "Java version:"
          java -version
          echo "Gradle version:"
          ./gradlew --version || echo "Gradle not available"

      - name: Build common module
        if: matrix.module != 'common'
        run: ./gradlew :common:build :common:publishToMavenLocal

      - name: Build and test ${{ matrix.module }}
        run: ./gradlew :${{ matrix.module }}:build :${{ matrix.module }}:test --no-daemon