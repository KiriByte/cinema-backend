name: CI on Pull Request to Develop
on:
  pull_request:
    branches:
      - develop
jobs:
  test:
    name: Runs Tests and Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5.0.0

      - name: Run tests with Gradle
        run: ./gradlew test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/testdb
          SPRING_DATASOURCE_USERNAME: testuser
          SPRING_DATASOURCE_PASSWORD: testpass

      - name: Build JAR
        run: ./gradlew botJar -x test

      - name: Build Docker image
        run: |
          docker build -t my-spring-app:${{ github.sha }} .
          docker images my-spring-app:${{ github.sha }}

      - name: Test Docker image
        run: |
          docker run --rm -d --name test-container -p 8080:8080 my-spring-app:${{ github.sha }}
          sleep 30
          curl -f http://localhost:8080/actuator/health || echo "Health check failed but continuing"
          docker stop test-container
