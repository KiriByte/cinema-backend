server:
  port: 8086

spring:
  application:
    name: auth-service
  flyway:
    enabled: true
    locations: classpath:db/migration/auth
    default-schema: auth_service_schema
    schemas: auth_service_schema
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd HH:mm:ss