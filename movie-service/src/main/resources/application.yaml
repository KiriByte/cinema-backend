server:
  port: 8080

spring:
  application:
    name: movie-service
  flyway:
    enabled: true
    locations: classpath:db/migration/movies
    default-schema: movie_service_schema
    schemas: movie_service_schema
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      file-size-threshold: 3MB
      resolve-lazily: false